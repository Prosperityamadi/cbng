services:
  postgres:
    image: postgres:16-alpine
    container_name: cbng-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nemicapital_bank
    ports:
      - "5432:5432"
    volumes:
      - cbng_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nemicapital_bank"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cbng-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cbng_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cbng_pgdata:
  cbng_redisdata:
