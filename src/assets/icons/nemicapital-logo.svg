<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Soft Drop Shadow for Tactile Depth -->
    <filter id="nemi-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#800D30" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Embedded High-Resolution Alpha Master for Precision Reproduction -->
    <clipPath id="logo-clip">
      <circle cx="512" cy="512" r="512" />
    </clipPath>
  </defs>

  <g filter="url(#nemi-glow)">
    <!-- Base64 Encoded Retina Alpha Master of the Official 3D Monogram -->
    <image 
      href="nemicapital-logo.png" 
      x="64" 
      y="64" 
      width="896" 
      height="896" 
      preserveAspectRatio="xMidYMid meet" 
    />
  </g>
</svg>
